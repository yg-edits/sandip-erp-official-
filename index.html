<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampusDesk | ERP Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7eeee;--card:#fff;--ink:#2a1414;--mute:#7a5f5f;--line:#e7cfcf;--acc:#c8102e;--acc-ink:#fff;--ok:#1a8a5a;--bad:#c23b3b;--warn:#b7791f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0f10;--card:#241515;--ink:#f6e9e9;--mute:#c79f9f;--line:#3d2222;--acc:#ff5a73;--acc-ink:#1a0f10;--ok:#4cc790;--bad:#ff7b7b;--warn:#f0b34d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a0f10;--card:#241515;--ink:#f6e9e9;--mute:#c79f9f;--line:#3d2222;--acc:#ff5a73;--acc-ink:#1a0f10;--ok:#4cc790;--bad:#ff7b7b;--warn:#f0b34d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px}
.lbox h1{font-size:28px;margin-bottom:4px}.lbox p{color:var(--mute);margin:0 0 18px}
.crest{display:block;margin:0 auto 14px}
.lbox .crest{width:84px;height:84px}
header .crest{width:34px;height:34px}
.brandrow{display:flex;align-items:center;gap:10px;justify-content:center;text-align:center}
.lbox .brandrow{flex-direction:column}
header .brandrow{flex:1;justify-content:flex-start;text-align:left}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.full{width:100%;margin-top:18px}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hint{font-size:12px;color:var(--mute);margin-top:12px}
.app{display:none;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
header b{font-size:18px;flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{white-space:nowrap;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--mute);font-weight:600}
nav button.on{background:var(--acc);color:var(--acc-ink)}
main{max-width:980px;margin:0 auto;padding:16px 14px 40px}
h2{font-size:24px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.big{font-size:34px;font-weight:800;line-height:1.1}.mute{color:var(--mute);font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.bar i.low{background:var(--bad)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:480px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mute);font-weight:600}tr:last-child td{border-bottom:0}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid currentColor}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.note{padding:12px 0;border-bottom:1px solid var(--line)}.note:last-child{border:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row input{flex:1;min-width:160px}

/* ERP-style portal login */
.login{background:linear-gradient(135deg,#fff 0%,#fff8f8 58%,#f8eeee 100%);padding:28px 16px}
.login-shell{width:min(100%,760px);background:#fff;border:1px solid #eadede;border-radius:20px;box-shadow:0 22px 70px rgba(68,20,28,.10);padding:30px;}
.login-brand{text-align:center;border-bottom:1px solid #eee3e3;padding-bottom:18px}
.university-logo{width:112px;height:112px;object-fit:contain;display:block;margin:0 auto 4px}
.portal-label{font-size:17px;font-weight:800;letter-spacing:.14em;color:#9d1026}.portal-label span{font-size:11px;letter-spacing:.22em;color:#746568;display:block;margin-top:3px}
.login-heading{text-align:center;padding:22px 0 18px}.login-heading .eyebrow{font-size:10px;letter-spacing:.2em;font-weight:800;color:#b21a32}.login-heading h1{font-size:30px;color:#261b1d;margin:5px 0}.login-heading p{margin:0;color:#78696b}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.role-card{position:relative;text-align:left;min-height:132px;padding:16px 14px;background:#fff;border:1px solid #e8dddd;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:7px;transition:.18s}.role-card:hover,.role-card.active{border-color:#bd1731;background:#fff8f8;box-shadow:0 5px 18px rgba(180,20,48,.08)}.role-icon{font-size:25px}.role-card b{font-size:14px;color:#2d2022}.role-card small{font-size:11px;color:#817477}.role-arrow{position:absolute;right:13px;top:14px;color:#b71932;font-size:18px}
.login-form{max-width:460px;margin:22px auto 0;padding:20px;background:#fcf9f9;border:1px solid #eee4e4;border-radius:12px}.form-title{font-weight:800;font-size:17px;color:#2c2022}.login-form input{background:#fff;border-color:#e4d8d9}.login-form .btn{background:#b5122c;border-radius:8px}.login-footer{text-align:center;font-size:11px;color:#8c7c7e;margin-top:18px}
@media(max-width:560px){.login-shell{padding:20px 15px;border-radius:15px}.university-logo{width:94px;height:94px}.role-grid{grid-template-columns:1fr;gap:8px}.role-card{min-height:76px;padding:12px 14px;padding-left:58px}.role-icon{position:absolute;left:15px;top:21px}.role-card small{font-size:11px}.login-heading h1{font-size:26px}.login-form{padding:16px}}

</style>
</head>

  const att=pct(subjects.reduce((s,x)=>s+x[1],0),subjects.reduce((s,x)=>s+x[2],0));
  const due=fees.reduce((s,f)=>s+f[1]-f[2],0);
  if(role==="admin")return `<h2>Overview</h2><div class="grid"><div class="card"><div class="big">${students.length}</div><div class="mute">Students enrolled</div></div><div class="card"><div class="big">${inr(due*students.length)}</div><div class="mute">Fees pending</div></div><div class="card"><div class="big">${notices.length}</div><div class="mute">Active notices</div></div></div>`;
  return `<h2>Today</h2><div class="grid"><div class="card"><div class="big">${att}%</div><div class="mute">Overall attendance</div>${bar(att)}</div><div class="card"><div class="big">${inr(due)}</div><div class="mute">Fees due</div></div><div class="card"><div class="big">${tt.Wed[0]}</div><div class="mute">First class, 9:00</div></div></div><h2 style="margin-top:22px">Latest notices</h2>${noticeList()}`},
 Attendance(){return `<h2>Attendance</h2>`+table(["Subject","Attended","Total","%"],subjects.map(s=>{const p=pct(s[1],s[2]);return [s[0],s[1],s[2],`<span class="${p<75?"bad":"ok"}">${p}%</span>${bar(p)}`]}))+`<p class="mute">Below 75% is flagged in red.</p>`},
 Timetable(){return `<h2>Timetable</h2>`+table(["Day",...slots],Object.entries(tt).map(([d,r])=>[`<b>${d}</b>`,...r]))},
 Fees(){const rows=fees.map(f=>{const d=f[1]-f[2];return [f[0],inr(f[1]),inr(f[2]),d?`<span class="tag warn">${inr(d)} due</span>`:`<span class="tag ok">Paid</span>`]});return `<h2>Fees</h2>`+table(["Item","Amount","Paid","Status"],rows)},
 Results(){const g=results.reduce((s,r)=>s+r[1],0)/results.length;return `<h2>Results</h2>`+table(["Subject","Marks","Out of","Grade"],results.map(r=>[r[0],r[1],r[2],`<b>${r[3]}</b>`]))+`<p class="mute">Average: ${g.toFixed(1)}%</p>`},
 Students(){return `<h2>Students</h2>`+table(["ID","Name","Branch","Attendance"],students.map(s=>[s[0],s[1],s[2],`<span class="${s[3]<75?"bad":"ok"}">${s[3]}%</span>`]))},
 Notices(){const add=role!=="student"?`<div class="card" style="margin-bottom:12px"><b>Post a notice</b><div class="row"><input id="nt" placeholder="Notice title"><button class="btn" id="np">Post notice</button></div></div>`:"";return `<h2>Notices</h2>${add}${noticeList()}`}
};
function show(t){tab=t;$("nav").innerHTML=tabs[role].map(x=>`<button class="${x===t?"on":""}" data-t="${x}">${x}</button>`).join("");
 $("main").innerHTML=views[t]();
 const np=$("np");if(np)np.onclick=()=>{const v=$("nt").value.trim();if(!v){$("nt").focus();return}notices.unshift([v,"Today"]);show("Notices")}}
$("nav").onclick=e=>{const t=e.target.dataset.t;if(t)show(t)};
$("go").onclick=()=>{role=$("role").value;$("who").textContent=($("uid").value.trim()||"Demo")+" · "+role;$("login").style.display="none";$("app").style.display="block";show("Dashboard")};
$("out").onclick=()=>{$("app").style.display="none";$("login").style.display="grid"};
</script>
</body>
</html>
